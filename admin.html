<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Catatan Kelas Bahasa Korea</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f5f6fa;
    margin: 0;
    padding: 20px;
    color: #222;
  }
  .card {
    max-width: 520px;
    margin: 20px auto;
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    padding: 24px;
  }
  h2 { margin-top: 0; font-size: 19px; }
  label { font-size: 13px; font-weight: 600; display: block; margin: 14px 0 6px; }
  input[type="email"], input[type="password"], input[type="url"], input[type="file"], textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
  }
  textarea { resize: vertical; min-height: 60px; }
  button {
    width: 100%;
    margin-top: 18px;
    padding: 12px;
    background: #2b3a67;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg { font-size: 13px; margin-top: 10px; }
  .msg.error { color: #c0392b; }
  .msg.success { color: #27ae60; }
  #logoutBtn { background: #999; margin-top: 8px; }
  #cancelEditBtn { background: #999; margin-top: 8px; display: none; }
  .preview { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .preview img { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; }

  .post-item {
    border: 1px solid #eee;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .post-item .date { font-size: 11px; color: #999; }
  .post-item .caption { font-size: 14px; margin: 4px 0; white-space: pre-wrap; }
  .post-item .thumbs { display: flex; gap: 4px; margin: 6px 0; flex-wrap: wrap; }
  .post-item .thumbs img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }
  .post-item .link { font-size: 12px; color: #2b3a67; word-break: break-all; }
  .post-item .actions { display: flex; gap: 8px; margin-top: 8px; }
  .post-item .actions button {
    width: auto;
    margin-top: 0;
    padding: 6px 14px;
    font-size: 12px;
    border-radius: 6px;
  }
  .post-item .editBtn { background: #2b3a67; }
  .post-item .deleteBtn { background: #c0392b; }
  .empty { text-align: center; color: #999; font-size: 13px; padding: 10px 0; }
</style>
</head>
<body>

<div class="card" id="loginCard">
  <h2>🔐 Login Guru</h2>
  <label>Email</label>
  <input type="email" id="email" placeholder="email@contoh.com">
  <label>Password</label>
  <input type="password" id="password">
  <button id="loginBtn">Masuk</button>
  <div class="msg error" id="loginMsg"></div>
</div>

<div class="card" id="formCard" style="display:none;">
  <h2 id="formTitle">📤 Tambah Materi Baru</h2>

  <label>Foto materi/catatan (bisa lebih dari satu)</label>
  <input type="file" id="photos" accept="image/*" multiple>
  <div class="preview" id="preview"></div>
  <div class="preview" id="existingPreview"></div>

  <label>Link tugas / kuis (opsional)</label>
  <input type="url" id="taskLink" placeholder="https://forms.google.com/...">

  <label>Catatan singkat (opsional)</label>
  <textarea id="caption" placeholder="Contoh: Materi hari ini tentang 안녕하세요..."></textarea>

  <button id="submitBtn">Bagikan ke Murid</button>
  <div class="msg" id="formMsg"></div>
  <div id="resultLink" style="display:none; margin-top:12px; padding:12px; background:#eef1fb; border-radius:8px; font-size:13px; word-break:break-all;"></div>

  <button id="cancelEditBtn">Batal Edit</button>
  <button id="logoutBtn">Keluar</button>
</div>

<div class="card" id="listCard" style="display:none;">
  <h2>🗂️ Materi Tersimpan</h2>
  <div id="postList"><p class="empty">Memuat...</p></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// GANTI dengan config Firebase Anda sendiri (sama seperti di index.html)
const firebaseConfig = {
  apiKey: "AIzaSyDHC1apydBUTxsz3ZhJUhw4ukNIb9WD90E",
  authDomain: "notepad-d9f0b.firebaseapp.com",
  projectId: "notepad-d9f0b",
  storageBucket: "notepad-d9f0b.firebasestorage.app",
  messagingSenderId: "1081281593555",
  appId: "1:1081281593555:web:ab931db0e2282f8e325426"
};
 
// API key gratis dari https://api.imgbb.com/ - dipakai untuk upload foto
const IMGBB_API_KEY = "4d9de9a82287ca38c3be81b9d278a234";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

async function uploadToImgbb(file) {
  const formData = new FormData();
  formData.append("image", file);
  const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
    method: "POST",
    body: formData
  });
  const data = await res.json();
  if (!data.success) {
    throw new Error(data.error?.message || "Upload ke ImgBB gagal");
  }
  return data.data.url;
}

const loginCard = document.getElementById("loginCard");
const formCard = document.getElementById("formCard");
const listCard = document.getElementById("listCard");
const loginMsg = document.getElementById("loginMsg");
const formMsg = document.getElementById("formMsg");
const formTitle = document.getElementById("formTitle");
const submitBtn = document.getElementById("submitBtn");
const cancelEditBtn = document.getElementById("cancelEditBtn");
const existingPreview = document.getElementById("existingPreview");

let selectedFiles = [];
let editingId = null;
let editingExistingPhotos = [];

onAuthStateChanged(auth, (user) => {
  if (user) {
    loginCard.style.display = "none";
    formCard.style.display = "block";
    listCard.style.display = "block";
    listenPosts();
  } else {
    loginCard.style.display = "block";
    formCard.style.display = "none";
    listCard.style.display = "none";
  }
});

document.getElementById("loginBtn").onclick = async () => {
  loginMsg.textContent = "";
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (err) {
    loginMsg.textContent = "Login gagal: email/password salah.";
  }
};

document.getElementById("logoutBtn").onclick = () => signOut(auth);

document.getElementById("photos").addEventListener("change", (e) => {
  selectedFiles = Array.from(e.target.files);
  const preview = document.getElementById("preview");
  preview.innerHTML = "";
  selectedFiles.forEach(file => {
    const img = document.createElement("img");
    img.src = URL.createObjectURL(file);
    preview.appendChild(img);
  });
});

function resetForm() {
  editingId = null;
  editingExistingPhotos = [];
  formTitle.textContent = "📤 Tambah Materi Baru";
  submitBtn.textContent = "Bagikan ke Murid";
  cancelEditBtn.style.display = "none";
  document.getElementById("photos").value = "";
  document.getElementById("preview").innerHTML = "";
  existingPreview.innerHTML = "";
  document.getElementById("taskLink").value = "";
  document.getElementById("caption").value = "";
  document.getElementById("resultLink").style.display = "none";
  selectedFiles = [];
  formMsg.textContent = "";
}

cancelEditBtn.onclick = resetForm;

submitBtn.onclick = async () => {
  formMsg.className = "msg";
  formMsg.textContent = "";

  const taskLink = document.getElementById("taskLink").value.trim();
  const caption = document.getElementById("caption").value.trim();

  if (selectedFiles.length === 0 && editingExistingPhotos.length === 0 && !taskLink && !caption) {
    formMsg.className = "msg error";
    formMsg.textContent = "Isi minimal satu: foto, link, atau catatan.";
    return;
  }

  submitBtn.disabled = true;
  formMsg.textContent = "Memproses...";

  try {
    const photoUrls = [...editingExistingPhotos];
    let i = 0;
    for (const file of selectedFiles) {
      i++;
      formMsg.textContent = `Mengunggah foto ${i} dari ${selectedFiles.length}...`;
      const url = await uploadToImgbb(file);
      photoUrls.push(url);
    }

    formMsg.textContent = "Menyimpan data...";

    if (editingId) {
      await updateDoc(doc(db, "posts", editingId), {
        photoUrls,
        taskLink: taskLink || null,
        caption: caption || null
      });
      formMsg.className = "msg success";
      formMsg.textContent = "Materi berhasil diperbarui!";
      resetFieldsOnly();
    } else {
      const docRef = await addDoc(collection(db, "posts"), {
        photoUrls,
        taskLink: taskLink || null,
        caption: caption || null,
        createdAt: serverTimestamp()
      });
      formMsg.className = "msg success";
      formMsg.textContent = "Berhasil dibagikan ke murid!";

      const postUrl = `${window.location.origin}/?post=${docRef.id}`;
      const resultEl = document.getElementById("resultLink");
      resultEl.style.display = "block";
      resultEl.innerHTML = `Link khusus materi ini:<br><b>${postUrl}</b>`;
      resetFieldsOnly();
    }
  } catch (err) {
    formMsg.className = "msg error";
    formMsg.textContent = "Gagal: " + err.message;
    console.error(err);
  } finally {
    submitBtn.disabled = false;
  }
};

function resetFieldsOnly() {
  document.getElementById("photos").value = "";
  document.getElementById("preview").innerHTML = "";
  selectedFiles = [];
  if (!editingId) {
    document.getElementById("taskLink").value = "";
    document.getElementById("caption").value = "";
  }
}

function startEdit(id, data) {
  editingId = id;
  editingExistingPhotos = data.photoUrls || [];
  formTitle.textContent = "✏️ Edit Materi";
  submitBtn.textContent = "Simpan Perubahan";
  cancelEditBtn.style.display = "block";
  document.getElementById("taskLink").value = data.taskLink || "";
  document.getElementById("caption").value = data.caption || "";
  document.getElementById("resultLink").style.display = "none";

  existingPreview.innerHTML = "";
  editingExistingPhotos.forEach((url) => {
    const img = document.createElement("img");
    img.src = url;
    img.title = "Foto lama (akan tetap dipakai)";
    existingPreview.appendChild(img);
  });

  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function removePost(id) {
  if (!confirm("Yakin hapus materi ini? Tidak bisa dikembalikan.")) return;
  try {
    await deleteDoc(doc(db, "posts", id));
  } catch (err) {
    alert("Gagal menghapus: " + err.message);
  }
}

function listenPosts() {
  const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
  onSnapshot(q, (snapshot) => {
    const listEl = document.getElementById("postList");
    if (snapshot.empty) {
      listEl.innerHTML = '<p class="empty">Belum ada materi.</p>';
      return;
    }
    listEl.innerHTML = "";
    snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const date = data.createdAt?.toDate
        ? data.createdAt.toDate().toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" })
        : "";

      const thumbs = (data.photoUrls || [])
        .map(url => `<img src="${url}">`)
        .join("");

      const item = document.createElement("div");
      item.className = "post-item";
      item.innerHTML = `
        <div class="date">${date}</div>
        ${data.caption ? `<div class="caption">${escapeHtml(data.caption)}</div>` : ""}
        <div class="thumbs">${thumbs}</div>
        ${data.taskLink ? `<div class="link">🔗 ${escapeHtml(data.taskLink)}</div>` : ""}
        <div class="actions">
          <button class="editBtn">Edit</button>
          <button class="deleteBtn">Hapus</button>
        </div>
      `;
      item.querySelector(".editBtn").onclick = () => startEdit(docSnap.id, data);
      item.querySelector(".deleteBtn").onclick = () => removePost(docSnap.id);
      listEl.appendChild(item);
    });
  });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
</script>

</body>
</html>
