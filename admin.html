<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=2">
<title>Admin - Catatan Konten</title>
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<div class="card" id="loginCard">
  <h2><svg class="icon" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Login</h2>
  <label>Email</label>
  <input type="email" id="email" placeholder="email@contoh.com">
  <label>Password</label>
  <input type="password" id="password">
  <button id="loginBtn">Masuk</button>
  <div class="msg error" id="loginMsg"></div>
</div>

<div class="card" id="contactCard" style="display:none;">
  <button type="button" class="accordion-toggle" id="contactToggle">
    <span class="accordion-label"><svg class="icon" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>Pengaturan Link Sosmed</span>
    <svg class="icon accordion-arrow" id="contactArrow" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <div class="accordion-body" id="contactBody">
    <label>Link Telegram (kosongkan jika tidak dipakai)</label>
    <input type="url" id="contactTelegram" placeholder="https://t.me/namagrup">
    <label>Link Tutorial (kosongkan jika tidak dipakai)</label>
    <input type="url" id="contactFacebook" placeholder="https://Tutorial.com/xxxx">
    <label>Link WhatsApp (kosongkan jika tidak dipakai)</label>
    <input type="url" id="contactWhatsapp" placeholder="https://chat.whatsapp.com/xxxx">
    <button id="saveContactBtn">Simpan Pengaturan</button>
    <div class="msg" id="contactMsg"></div>
  </div>
</div>

<div class="card" id="formCard" style="display:none;">
  <h2><svg class="icon" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span id="formTitleText">Tambah Konten Baru</span></h2>

  <label>Foto konten/catatan (bisa lebih dari satu)</label>
  <input type="file" id="photos" accept="image/*" multiple>
  <div class="preview" id="preview"></div>
  <div class="preview" id="existingPreview"></div>

  <label>Link (konten, video, dll — bisa lebih dari satu)</label>
  <div id="linksContainer"></div>
  <button type="button" id="addLinkBtn">+ Tambah Link</button>

  <label>Kategori/Tag (opsional, pisah dengan koma — misal: kuis, grammar)</label>
  <input type="text" id="tags" placeholder="misal: kuis, grammar">

  <label>Catatan Judul (opsional)</label>
  <textarea id="caption" placeholder="Contoh: Konten hari ini tentang..."></textarea>

  <button id="submitBtn">Bagikan Konten</button>
  <div class="msg" id="formMsg"></div>
  <div id="resultLink" style="display:none; margin-top:12px; padding:12px; background:#eef1fb; border-radius:8px; font-size:13px; word-break:break-all;"></div>

  <button id="cancelEditBtn">Batal Edit</button>
  <button id="logoutBtn">Keluar</button>
</div>

<div class="card" id="listCard" style="display:none;">
  <h2><svg class="icon" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>Konten Tersimpan<span class="count-badge" id="totalPostCount">0</span></h2>

  <div class="admin-search-wrap">
    <input type="text" id="adminSearchInput" placeholder="Pencarian...">
    <button type="button" class="clearSearchBtn" id="adminSearchClear"><svg class="icon-sm" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="admin-search-count" id="adminSearchCount"></div>

  <div class="admin-sort-chip-bar" id="adminSortChipBar">
    <button type="button" class="admin-sort-chip active" data-sort="terbaru">Terbaru</button>
    <button type="button" class="admin-sort-chip" data-sort="terlama">Terlama</button>
    <button type="button" class="admin-sort-chip" data-sort="terpopuler">Terpopuler</button>
  </div>

  <div id="postList"><p class="empty">Memuat...</p></div>
</div>

<div class="crop-modal-overlay" id="cropModalOverlay">
  <div class="crop-modal-card">
    <button type="button" class="crop-close-btn" id="cropCloseBtn" title="Batal"><svg class="icon-sm" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <h2 class="crop-modal-title"><svg class="icon" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>Atur Foto</h2>

    <div class="crop-stage-wrap">
      <div class="crop-stage" id="cropStage">
        <img id="cropImg" src="" alt="">
        <div class="crop-grid"></div>
      </div>
    </div>

    <div class="crop-aspect-bar" id="cropAspectBar">
      <button type="button" class="crop-aspect-chip active" data-ratio="0">Bebas</button>
      <button type="button" class="crop-aspect-chip" data-ratio="1">1:1</button>
      <button type="button" class="crop-aspect-chip" data-ratio="0.8">4:5</button>
      <button type="button" class="crop-aspect-chip" data-ratio="0.75">3:4</button>
      <button type="button" class="crop-aspect-chip" data-ratio="1.7778">16:9</button>
      <button type="button" class="crop-aspect-chip" data-ratio="0.5625">9:16</button>
    </div>

    <div class="crop-zoom-row">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.2" y2="16.2"/></svg>
      <input type="range" id="cropZoomRange" min="100" max="300" value="100">
    </div>
    <div class="crop-hint">Geser foto untuk atur posisi, gunakan slider untuk zoom</div>

    <div class="crop-actions-row">
      <button type="button" class="crop-secondary-btn" id="cropSwapBtn">Ganti Foto</button>
      <button type="button" id="cropConfirmBtn">Gunakan Foto</button>
    </div>
    <input type="file" id="cropSwapInput" accept="image/*" style="display:none;">
  </div>
</div>

<script type="module" src="/js/admin.js"></script>

</body>
</html>
