<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serba Nikmat</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f5f6fa;
    margin: 0;
    padding: 0 0 40px 0;
    color: #222;
  }
  header {
    background: #2b3a67;
    color: white;
    padding: 20px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 5px 0 0; font-size: 13px; opacity: 0.85; }

  .container {
    max-width: 640px;
    margin: 20px auto;
    padding: 0 15px;
  }

  .post {
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    margin-bottom: 20px;
    overflow: hidden;
  }
  .post-date {
    font-size: 12px;
    color: #888;
    padding: 12px 15px 0 15px;
  }
  .post-caption {
    padding: 8px 15px 0 15px;
    font-size: 15px;
    white-space: pre-wrap;
  }
  .post-photos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 4px;
    padding: 10px 15px;
  }
  .post-photos img {
    width: 100%;
    border-radius: 8px;
    display: block;
    cursor: pointer;
  }
  .post-link {
    display: block;
    margin: 0 15px 15px 15px;
    background: #2b3a67;
    color: white;
    text-align: center;
    padding: 10px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
  }
  .post-share {
    display: block;
    width: calc(100% - 30px);
    margin: 0 15px 15px 15px;
    background: white;
    color: #2b3a67;
    text-align: center;
    padding: 10px;
    border-radius: 8px;
    border: 1.5px solid #2b3a67;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  .post-share:active { background: #eef1fb; }

  .post-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    padding: 8px 15px 0 15px;
  }
  .tag-chip {
    text-decoration: none;
    background: #eef1fb;
    color: #2b3a67;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }
  .tag-chip:active { background: #dde3f7; }

.category-bar {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 14px 15px 4px 15px;
  margin-top: 14px;
  border-top: 1px solid #e3e5ec;
  -webkit-overflow-scrolling: touch;
} 
  .category-bar::-webkit-scrollbar { display: none; }
  .category-chip {
    flex: 0 0 auto;
    text-decoration: none;
    background: #2b3a67;
    color: #fff;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .category-chip.active {
    background: #eef1fb;
    color: #2b3a67;
    border: 1.5px solid #2b3a67;
  }
  .empty {
    text-align: center;
    color: #999;
    margin-top: 60px;
  }
  .section-title {
    font-size: 13px;
    font-weight: 700;
    color: #2b3a67;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 24px 0 10px;
  }
  .section-title:first-child { margin-top: 0; }

  /* lightbox sederhana */
  .lightbox {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 20px;
  }
  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 8px;
  }

  .contact-bar{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    padding: 0 15px;
  }

  .contact-bar a{
    text-decoration:none;
    background:#2b3a67;
    color:#fff;
    padding:8px 12px;
    border-radius:8px;
    font-size:12px;
    font-weight:600;
  }

 .ads-banner{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:12px auto;
 }

</style>
</head>
<body>

<header>
  <h1>Serba Nikmat🥵</h1>
  <p>Konten update tiap hari</p>
</header>

<div class="ads-banner">
<script>
atOptions = {
  'key': 'c815dc8b1442b1b2e98cf2ac0376024c',
  'format': 'iframe',
  'height': 50,
  'width': 320,
  'params': {}
};
</script>
<script src="https://inputoppose.com/c815dc8b1442b1b2e98cf2ac0376024c/invoke.js"></script>
</div>

<div class="contact-bar" id="contactBar"></div>

<div class="category-bar" id="categoryBar"></div>

<div class="container" id="posts">
  <p class="empty">Memuat konten...</p>
</div>

<div class="lightbox" id="lightbox" onclick="this.style.display='none'">
  <img id="lightbox-img" src="">
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, where, orderBy, limit, onSnapshot, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyDHC1apydBUTxsz3ZhJUhw4ukNIb9WD90E",
  authDomain: "notepad-d9f0b.firebaseapp.com",
  projectId: "notepad-d9f0b",
  storageBucket: "notepad-d9f0b.firebasestorage.app",
  messagingSenderId: "1081281593555",
  appId: "1:1081281593555:web:ab931db0e2282f8e325426"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const postsEl = document.getElementById("posts");
const postId = new URLSearchParams(window.location.search).get("post");
const tagParam = new URLSearchParams(window.location.search).get("tag");

loadContactBar();
loadCategoryBar();

async function loadContactBar() {
  try {
    const snap = await getDoc(doc(db, "settings", "contact"));
    if (!snap.exists()) return;
    const data = snap.data();
    const bar = document.getElementById("contactBar");
    let html = "";
    if (data.telegram) {
      html += `<a href="${data.telegram}" target="_blank" rel="noopener noreferrer">📢 Telegram</a>`;
    }
    if (data.facebook) {
      html += `<a href="${data.facebook}" target="_blank" rel="noopener noreferrer">👀 Cara nonton</a>`;
    }
    if (data.whatsapp) {
      html += `<a href="${data.whatsapp}" target="_blank" rel="noopener noreferrer">💬 WhatsApp</a>`;
    }
    bar.innerHTML = html;
  } catch (err) {
    console.error("Gagal memuat pengaturan kontak:", err);
  }
}

function loadCategoryBar() {
  const bar = document.getElementById("categoryBar");
  const qAll = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(200));
  onSnapshot(qAll, (snapshot) => {
    const allTags = new Set();
    snapshot.forEach((docSnap) => {
      (docSnap.data().tags || []).forEach((t) => allTags.add(t));
    });
    if (allTags.size === 0) {
      bar.innerHTML = "";
      return;
    }
    let html = `<a class="category-chip${!tagParam ? " active" : ""}" href="${window.location.origin}/">Semua</a>`;
    allTags.forEach((t) => {
      const isActive = tagParam === t;
      html += `<a class="category-chip${isActive ? " active" : ""}" href="?tag=${encodeURIComponent(t)}">#${escapeHtml(t)}</a>`;
    });
    bar.innerHTML = html;
  });
}

function renderPost(docSnap) {
  const data = docSnap.data();
  const date = data.createdAt?.toDate
    ? data.createdAt.toDate().toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" })
    : "";

  const photos = (data.photoUrls || [])
    .map(url => `<img src="${url}" onclick="openLightbox('${url}')">`)
    .join("");

  const linksList = data.links || (data.taskLink ? [{ label: "Buka video", url: data.taskLink }] : []);
  const linkBtns = linksList
    .map(l => `<a class="post-link" href="${l.url}" target="_blank" rel="noopener noreferrer">▶️ ${escapeHtml(l.label)}</a>`)
    .join("");

  const caption = data.caption
    ? `<div class="post-caption">${escapeHtml(data.caption)}</div>`
    : "";

  const tagsList = data.tags || [];
  const tagsHtml = tagsList.length
    ? `<div class="post-tags">${tagsList.map(t => `<a class="tag-chip" href="?tag=${encodeURIComponent(t)}">#${escapeHtml(t)}</a>`).join("")}</div>`
    : "";

  const shareUrl = `${window.location.origin}/?post=${docSnap.id}`;

  const post = document.createElement("div");
  post.className = "post";
  post.innerHTML = `
    <div class="post-date">${date}</div>
    ${caption}
    ${tagsHtml}
    <div class="post-photos">${photos}</div>
    ${linkBtns}
    <button class="post-share" onclick="sharePost('${shareUrl}', '${date}')">🔗 Bagikan Konten</button>
  `;
  return post;
}

if (postId) {
  getDoc(doc(db, "posts", postId)).then((docSnap) => {
    if (!docSnap.exists()) {
      postsEl.innerHTML = '<p class="empty">Materi tidak ditemukan.</p>';
      return;
    }
    postsEl.innerHTML = "";
    postsEl.appendChild(renderPost(docSnap));

    // Bar konten lainnya, live update, di bawah post yang dibagikan
    const otherWrap = document.createElement("div");
    otherWrap.id = "otherPosts";
    postsEl.appendChild(otherWrap);

    const qOthers = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(10));
    onSnapshot(qOthers, (snapshot) => {
      const others = snapshot.docs.filter(d => d.id !== postId);
      if (others.length === 0) {
        otherWrap.innerHTML = "";
        return;
      }
      otherWrap.innerHTML = "";
      const title = document.createElement("div");
      title.className = "section-title";
      title.textContent = "Konten Lainnya";
      otherWrap.appendChild(title);
      others.forEach((d) => otherWrap.appendChild(renderPost(d)));

      const seeAll = document.createElement("a");
      seeAll.className = "post-link";
      seeAll.href = window.location.origin + "/";
      seeAll.textContent = "📂 Lihat Semua Konten";
      otherWrap.appendChild(seeAll);
    });
  }).catch(() => {
    postsEl.innerHTML = '<p class="empty">Gagal memuat materi.</p>';
  });
} else if (tagParam) {
  const qTag = query(collection(db, "posts"), where("tags", "array-contains", tagParam), orderBy("createdAt", "desc"));
  onSnapshot(qTag, (snapshot) => {
    postsEl.innerHTML = "";
    const header = document.createElement("div");
    header.className = "section-title";
    header.textContent = `Tag: ${tagParam}`;
    postsEl.appendChild(header);

    if (snapshot.empty) {
      const empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = "Belum ada konten dengan tag ini.";
      postsEl.appendChild(empty);
    } else {
      snapshot.forEach((d) => postsEl.appendChild(renderPost(d)));
    }

    const seeAll = document.createElement("a");
    seeAll.className = "post-link";
    seeAll.href = window.location.origin + "/";
    seeAll.textContent = "📂 Lihat Semua Konten";
    postsEl.appendChild(seeAll);
  });
} else {
 
  const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
  onSnapshot(q, (snapshot) => {
    if (snapshot.empty) {
      postsEl.innerHTML = '<p class="empty">Belum ada konten.</p>';
      return;
    }

    const now = new Date();
    const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const sevenDaysAgo = new Date(startOfToday.getTime() - 6 * 24 * 60 * 60 * 1000);

    const groups = { hariIni: [], mingguIni: [], lebihLama: [] };

    snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const created = data.createdAt?.toDate ? data.createdAt.toDate() : null;
      if (created && created >= startOfToday) {
        groups.hariIni.push(docSnap);
      } else if (created && created >= sevenDaysAgo) {
        groups.mingguIni.push(docSnap);
      } else {
        groups.lebihLama.push(docSnap);
      }
    });

    postsEl.innerHTML = "";
    const sections = [
      { key: "hariIni", label: "Hari Ini" },
      { key: "mingguIni", label: "Minggu Ini" },
      { key: "lebihLama", label: "Lebih Lama" }
    ];

    sections.forEach(({ key, label }) => {
      if (groups[key].length === 0) return;
      const title = document.createElement("div");
      title.className = "section-title";
      title.textContent = label;
      postsEl.appendChild(title);
      groups[key].forEach((docSnap) => {
        postsEl.appendChild(renderPost(docSnap));
      });
    });
  });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

window.openLightbox = function(url) {
  document.getElementById("lightbox-img").src = url;
  document.getElementById("lightbox").style.display = "flex";
};

window.sharePost = async function(url, dateLabel) {
  const shareData = {
    title: "Catatan Konten",
    text: `Konten data tanggal ${dateLabel}`,
    url: url
  };

  if (navigator.share) {
    try {
      await navigator.share(shareData);
    } catch (err) {
      // Pengguna membatalkan share, tidak perlu ditampilkan sebagai error
    }
  } else if (navigator.clipboard) {
    try {
      await navigator.clipboard.writeText(url);
      alert("Link disalin! Silakan tempel ke aplikasi yang diinginkan.");
    } catch (err) {
      prompt("Salin link ini secara manual:", url);
    }
  } else {
    prompt("Salin link ini secara manual:", url);
  }
};
</script>
<script src="https://inputoppose.com/84/0e/16/840e169d1e3f86906bb1490d05d95d42.js"></script>
</body>
</html>
